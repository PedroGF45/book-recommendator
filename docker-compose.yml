services:
  db:
    image: postgres:latest
    container_name: book_recommendator_db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_book_recommendator_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_book_recommendator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: