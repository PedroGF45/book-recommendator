<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-gray-800 border-b border-gray-700 px-8 py-4 flex justify-between items-center shadow-lg">
        <a href="/" class="text-2xl font-bold text-indigo-400 hover:text-indigo-300">📚 BookRecommendator</a>
        <a href="/books/new" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg transition">
            + Add Book Manually
        </a>
    </nav>

    <main class="container mx-auto px-6 py-8 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 text-center py-4 text-gray-500 text-sm">
        Book Recommendation Engine &copy; 2026
    </footer>
</body>
</html>
