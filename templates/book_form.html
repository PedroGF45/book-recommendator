{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-indigo-300">
        {% if book %}Edit Book: {{ book.title }}{% else %}Add New Book{% endif %}
    </h2>

    <form action="{% if book %}/books/{{ book.id }}/update{% else %}/books/create{% endif %}" method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Title</label>
            <input type="text" name="title" value="{{ book.title if book else '' }}" required
                   class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Author</label>
            <input type="text" name="author" value="{{ book.author if book else '' }}" required
                   class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Genres</label>
                <input type="text" name="genres" value="{{ book.genres if book else '' }}" placeholder="Fiction, Sci-Fi"
                       class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">ISBN</label>
                <input type="text" name="isbn" value="{{ book.isbn if book else '' }}"
                       class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Description</label>
            <textarea name="description" rows="4" 
                      class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">{{ book.description if book else '' }}</textarea>
        </div>

        <div class="flex justify-end gap-4 pt-4">
            <a href="/" class="px-5 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 transition">Cancel</a>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-lg transition">
                {% if book %}Save Changes{% else %}Create Book{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
